services:
  app-021:
    build: .
    image: app-021-bugfix-14-classroom-seating-rotation
    container_name: app-021-bugfix-14
    ports:
      - "8231:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
